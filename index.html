<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Declaración del conjunto de caracteres estándar (UTF-8) para soportar tildes y caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Configuración para que la interfaz sea Responsive y se adapte al ancho de pantalla de celulares y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cosmeth Stylos - Iniciar Sesión</title>

    <!-- INCLUSIÓN DE RECURSOS EXTERNOS (CDN) -->
    <!-- Framework Bootstrap 5: Utilizado para la grilla responsive y componentes base de diseño -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Librería FontAwesome: Proporciona los iconos vectoriales de la interfaz (usuario, candado, etc.) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ARCHIVO DE ESTILOS PROPIO -->
    <!-- Conexión con la hoja de estilos personalizada respetando la arquitectura de carpetas assets/css/ -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <!-- CONTENEDOR PRINCIPAL SEMÁNTICO (<main>) -->
    <!-- 'login-card' aplica el diseño de tarjeta; 'text-center' centra los elementos dinámicos -->
    <main class="login-card text-center">

        <!-- SECCIÓN 1: ENCABEZADO DE MARCA E IDENTIDAD VISUAL -->
        <header class="mb-4">
            <!-- Icono distintivo del negocio Cosmeth Stylos -->
            <i class="fa-solid fa-pump-soap brand-icon mb-2"></i>
            <!-- Título principal con la marca institucional -->
            <h1 class="brand-title h4">COSMETH STYLOS</h1>
            <p class="text-muted small">Sistema POS Cosmética y Estilo</p>
        </header>

        <!-- Título secundario del módulo actual -->
        <h2 class="h5 mb-4 text-secondary">Iniciar Sesión</h2>

        <!-- SECCIÓN 2: COMPONENTE DE ALERTA DINÁMICA -->
        <!-- Oculto por defecto mediante CSS ('display: none'). JavaScript lo activa si existen errores de validación -->
        <div id="errorAlert" class="alert alert-error p-2 mb-3" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-1"></i>
            <!-- Span donde JavaScript inyectará dinámicamente el texto descriptivo del error -->
            <span id="errorMessage">Mensaje de error</span>
        </div>

        <!-- SECCIÓN 3: FORMULARIO DE AUTENTICACIÓN -->
        <!-- 'novalidate' deshabilita las alertas por defecto del navegador para usar nuestras validaciones de JS -->
        <form id="loginForm" novalidate>

            <!-- Campo 1: Usuario -->
            <div class="mb-3 text-start">
                <label for="usuario" class="form-label text-muted small fw-bold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" class="form-control" id="usuario" placeholder="Nombre de usuario" required>
                </div>
            </div>

            <!-- Campo 2: Contraseña -->
            <div class="mb-4 text-start">
                <label for="password" class="form-label text-muted small fw-bold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="******" required>
                </div>
            </div>

            <!-- Botón de Envío (Submit) -->
            <button type="submit" class="btn btn-rosa w-100 mb-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i>INGRESAR
            </button>
        </form>

        <!-- Enlace auxiliar para recuperación de credenciales -->
        <a href="#" class="text-decoration-none small text-muted">¿Olvidaste tu contraseña?</a>

        <!-- SECCIÓN 4: PIE DE PÁGINA DEL MÓDULO (FOOTER) -->
        <footer class="mt-4 pt-3 border-top text-muted" style="font-size: 0.75rem;">
            &copy; 2026 Cosmeth Stylos | Soporte Técnico: +57 350 884 50 12
        </footer>
    </main>

    <!-- INCLUSIÓN DEL SCRIPT MODULAR DE JAVASCRIPT -->
    <!-- Se ubica al final del <body> para asegurar que todo el HTML esté cargado en memoria antes de ejecutar JS -->
    <script src="assets/js/login.js"></script>
</body>

</html>
