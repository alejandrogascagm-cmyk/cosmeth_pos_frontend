<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmeth Stylos - Gestión de Productos (React JS)</title>

    <!-- Framework Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos Personalizados Modulares -->
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- Librerías Oficiales de React via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
</head>

<body class="bg-light">

    <div class="container py-4">
        <!-- ENCABEZADO DEL MÓDULO -->
        <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
            <h1 class="h3 brand-title">
                <i class="fa-solid fa-boxes-packing brand-icon me-2"></i>Gestión de Productos
            </h1>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-right-from-bracket me-1"></i>Cerrar Sesión
            </a>
        </header>

        <!-- MÓDULO REACT COMPLETO (FORMULARIO Y TABLA) -->
        <div id="root-react"></div>
    </div>

    <!-- Carga del Componente React -->
    <script src="assets/components/TablaProductos.js"></script>

    <!-- Renderizado de React -->
    <script>
        const rootElement = document.getElementById('root-react');
        const root = ReactDOM.createRoot(rootElement);
        root.render(React.createElement(ModuloProductosPOS));
    </script>
</body>

</html>
