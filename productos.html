<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmeth Stylos - Gestión de Productos (CRUD)</title>
    <!-- Framework Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos Personalizados Modulares -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="bg-light">

    <div class="container py-4">
        <!-- ENCABEZADO DEL MÓDULO -->
        <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
            <h1 class="h3 brand-title">
                <i class="fa-solid fa-boxes-packing brand-icon me-2"></i>Gestión de Productos
            </h1>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-right-from-bracket me-1"></i>Cerrar Sesión
            </a>
        </header>

        <div class="row g-4">
            <!-- SECCIÓN 1: FORMULARIO (CREATE / UPDATE) -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white font-weight-bold">
                        <i class="fa-solid fa-pen-to-square me-1 text-danger"></i>
                        <span id="formTitle">Agregar Producto</span>
                    </div>
                    <div class="card-body">
                        <form id="productoForm" novalidate>
                            <!-- ID Oculto para identificar si es actualización (Update) -->
                            <input type="hidden" id="productoId">

                            <div class="mb-3">
                                <label for="codigo" class="form-label small fw-bold">Código de Barras</label>
                                <input type="text" class="form-control" id="codigo" placeholder="Ej: PROD001" required>
                            </div>

                            <div class="mb-3">
                                <label for="nombre" class="form-label small fw-bold">Nombre del Producto</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej: Labial Mate Rosa"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="precio" class="form-label small fw-bold">Precio de Venta ($)</label>
                                <input type="number" class="form-control" id="precio" placeholder="25000" required>
                            </div>

                            <div class="mb-3">
                                <label for="stock" class="form-label small fw-bold">Stock Inicial</label>
                                <input type="number" class="form-control" id="stock" placeholder="10" required>
                            </div>

                            <button type="submit" id="btnGuardar" class="btn btn-rosa w-100">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Producto
                            </button>
                            <button type="button" id="btnCancelar" class="btn btn-secondary w-100 mt-2 d-none">
                                Cancelar Edición
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: TABLA DE DATOS (READ / DELETE) -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <span class="fw-bold"><i class="fa-solid fa-list me-1 text-muted"></i> Catálogo de
                            Inventario</span>
                        <small class="text-muted" id="totalRegistros">0 Productos</small>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Código</th>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaProductos">
                                    <!-- Filas generadas dinámicamente con JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Modular CRUD JavaScript -->
    <script src="assets/js/productos.js"></script>
</body>

</html>
